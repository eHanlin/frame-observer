<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>frame-observer parent</title>
</head>
<body>
  <script src="build/frameObserver.test.js"></script>
  <script>
    // Child frames are served from another origin to exercise real cross-origin postMessage.
    window.CHILD_ORIGIN = location.protocol + '//127.0.0.1:' + location.port;
    window.$frames = {};

    /**
     * @param {String} name iframe name (used by Playwright's page.frame({name}))
     * @param {String} [query] extra query string for child.html
     * @type Promise resolved on iframe load
     */
    window.createFrame = function (name, query) {
      return new Promise(function (resolve) {
        var iframe = document.createElement('iframe');
        iframe.name = name;
        iframe.onload = function () { resolve(); };
        iframe.src = CHILD_ORIGIN + '/child.html?name=' + encodeURIComponent(name) + (query ? '&' + query : '');
        window.$frames[name] = iframe;
        document.body.appendChild(iframe);
      });
    };

    /**
     * Resolves with 'timeout' when the promise does not settle within ms.
     */
    window.settleWithin = function (promise, ms) {
      return Promise.race([
        promise.then(
          function (value) { return { status: 'resolved', value: value }; },
          function (reason) { return { status: 'rejected', reason: reason }; }
        ),
        new Promise(function (resolve) { setTimeout(function () { resolve({ status: 'timeout' }); }, ms); })
      ]);
    };
  </script>
</body>
</html>
